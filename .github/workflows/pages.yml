# Publishes the website to GitHub Pages: https://<owner>.github.io/<repo>/
# Needs: Settings > Pages > Source = "GitHub Actions", and the repository variable API_BASE_URL (the Worker URL).
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the static site
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_BOOKING_URL: ${{ vars.BOOKING_URL }}
          NEXT_PUBLIC_PRIVACY_URL: ${{ vars.PRIVACY_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_BASE" ]; then
            echo "::error::Set the repository variable API_BASE_URL to your Worker URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          npm ci
          npx next build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
